[project]
name = "cottonlens-ml"
version = "0.1.0"
description = "Colab-only training pipeline for CottonLens AI"
requires-python = ">=3.12,<3.14"
dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "mlflow>=3.0,<4",
  "numpy>=2.1,<3",
  "onnxruntime>=1.20,<2",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "requests>=2.32,<3",
  "scikit-learn>=1.6,<2",
  "shap>=0.47,<1",
  "tensorflow>=2.20,<2.22",
  "tf2onnx>=1.16,<2",
  "xgboost>=3.0,<4",
  "yfinance>=0.2.54,<1",
]

[project.scripts]
cottonlens-train = "cottonlens_ml.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cottonlens_ml"]
