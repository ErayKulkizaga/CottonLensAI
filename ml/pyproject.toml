[project]
name = "cottonlens-ml"
version = "0.1.0"
description = "Colab-only training pipeline for CottonLens AI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "catboost==1.2.8",
  "joblib==1.4.2",
  "keras==3.10.0",
  "matplotlib==3.10.0",
  "ml-dtypes==0.5.1",
  "mlflow==3.16.1",
  "numpy==2.1.3",
  "onnx==1.17.0",
  "onnxruntime==1.22.1",
  "optuna==4.5.0",
  "pandas==2.2.3",
  "protobuf==5.29.6",
  "pyarrow==21.0.0",
  "pytest==8.3.5",
  "requests==2.32.3",
  "scikit-learn==1.6.1",
  "shap==0.47.2",
  "tensorflow==2.20.0",
  "tf2onnx==1.17.0",
  "xgboost==3.0.2",
  "yfinance==0.2.54",
]

[project.scripts]
cottonlens-train = "cottonlens_ml.pipeline:main"

[project.optional-dependencies]
cuda = ["tensorflow[and-cuda]==2.20.0; sys_platform == 'linux'"]
data = ["curl-cffi==0.13.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cottonlens_ml"]

[dependency-groups]
cpu = [
  "numpy==2.1.3", "pandas==2.2.3", "pyarrow==21.0.0",
  "scipy==1.18.1", "statsmodels==0.14.5", "arch==7.2.0",
  "scikit-learn==1.6.1", "xgboost==3.0.2", "requests==2.32.3",
  "yfinance==0.2.54", "pytest==8.3.5", "threadpoolctl==3.7.0",
]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
