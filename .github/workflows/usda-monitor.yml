name: usda-monitor

# Runs the USDA cotton forecast monitor after Crop Production release days (Aug-Dec, around the 8th-14th) and on demand.
# GitHub runs scheduled workflows only from the default branch.
on:
  schedule:
    - cron: "30 17 8-14 8-12 *"
  workflow_dispatch:
    inputs:
      month:
        description: "Report month YYYY-MM (default: current month)"
        required: false

permissions:
  contents: write
  issues: write

# One run at a time: two runs could both see a report as unlogged and append it twice.
concurrency:
  group: usda-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONTH: ${{ github.event.inputs.month }}  # passed as data, validated by monitor.py; never pasted into the shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: pip install numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 scikit-learn==1.6.1
      - name: Run monitor
        run: python research/monitor/monitor.py run "$MONTH"
      - name: Verify log chain
        run: python research/monitor/monitor.py verify
      - name: Publish performance page and latest.json
        run: python research/monitor/publish.py
      - name: Commit log and page if a new record was logged
        id: commit
        run: |
          git config user.name "usda-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add research/monitor/log.jsonl docs/monitor
          if ! git diff --cached --quiet research/monitor/log.jsonl; then echo "new_record=true" >> "$GITHUB_OUTPUT"; fi
          git diff --cached --quiet || (git commit -m "monitor: log USDA report" && git push)
      - name: Fail if the month's report is still missing on the 14th
        run: python research/monitor/monitor.py check "$MONTH"
      - name: Fail if the new record fell back to USDA
        if: steps.commit.outputs.new_record == 'true'
        run: python -c "import json,sys; r=json.load(open('docs/monitor/latest.json')); sys.exit(0 if r.get('status') in (None,'ok') else 1)"
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "usda-monitor failed (${{ github.run_id }})" --body "Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed. Check the log step, gates and the latest record." --label monitor || gh issue create --title "usda-monitor failed (${{ github.run_id }})" --body "Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed."
