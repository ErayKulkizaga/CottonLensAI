name: usda-monitor

# Runs the USDA cotton forecast monitor after Crop Production release days (Aug-Dec, around the 8th-14th) and on demand.
# Note: GitHub runs scheduled workflows only from the default branch; until this file is on main, use workflow_dispatch.
on:
  schedule:
    - cron: "30 17 8-14 8-12 *"
  workflow_dispatch:
    inputs:
      month:
        description: "Report month YYYY-MM (default: current month)"
        required: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: pip install numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 scikit-learn==1.6.1
      - name: Run monitor
        run: python research/monitor/monitor.py run ${{ github.event.inputs.month }}
      - name: Verify log chain
        run: python research/monitor/monitor.py verify
      - name: Commit log if it changed
        run: |
          git config user.name "usda-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add research/monitor/log.jsonl
          git diff --cached --quiet || (git commit -m "monitor: log USDA report" && git push)
